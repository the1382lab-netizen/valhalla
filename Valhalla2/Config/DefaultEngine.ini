

[/Script/EngineSettings.GameMapsSettings]
; Phase 3's persistent world. Editor, standalone client and dedicated server all
; open the same level so "it worked in PIE" and "it worked on the server" mean
; the same thing — which was true of the Phase 2a greybox and matters more now,
; because L_World is the only level that has the streaming sublevels, and a
; server that opened a zone sublevel directly would host one zone instead of
; two and no portal in it would lead anywhere.
;
; L_GreyBox and L_LoSTest are still there and still work; they are fixtures,
; opened by hand or by the automation that needs them, and neither has a zone
; volume — which is exactly why AValhallaZoneSubsystem and AValhallaFogRenderer
; both fall back cleanly when there are none.
;
; Phase 7b splits the two defaults apart, and that split is the whole session
; flow in two lines. A *client* now starts on L_FrontEnd and logs in; a
; *server* still starts on L_World, because a server has nobody to log in and
; the front end is a menu. L_FrontEnd carries no zone volume, no streaming
; sublevel and no lighting worth the name — it is a dark box behind a UMG
; widget, and the only level in the project a player is ever in without a pawn.
GameDefaultMap=/Game/Valhalla/Maps/L_FrontEnd
EditorStartupMap=/Game/Valhalla/Maps/L_World
ServerDefaultMap=/Game/Valhalla/Maps/L_World
; Set in C++, not in a Blueprint: the game mode is the authority boundary and
; every rule it applies is reviewable source.
GlobalDefaultGameMode=/Script/ValhallaGame.ValhallaGameMode
;
; L_FrontEnd must not get AValhallaGameMode — it starts the admin API, expects
; zone volumes and spawns a character, none of which means anything on a login
; screen. Its game mode is `AValhallaFrontEndGameMode`, set as the level's own
; World Settings > GameMode Override rather than as an entry here, because a
; per-map override travels with the map and an ini entry does not: a level
; renamed or moved without the ini being edited would silently fall back to the
; global default and spawn a character behind the login card.

[/Script/OnlineSubsystemUtils.IpNetDriver]
; constants.ts:13 SERVER_TICK_RATE. The 1.0 server simulated and pushed state at
; 60 Hz; matching it here keeps the observed correction rate the same.
NetServerMaxTickRate=60
; Phase 5. How long an actor that has stopped being relevant keeps its channel
; open before the server tears it down and the client destroys it. The default
; is 5 seconds, which is tuned for distance culling — an actor that left the cull
; radius is probably coming back and a 5 second grace saves re-creating the
; channel. Line-of-sight culling inverts that: 5 seconds means an enemy stays
; drawn on a client's screen for 5 seconds after ducking behind a wall, and
; worse, keeps receiving position updates the whole time. Half a second is short
; enough that the leak is not usable and long enough to absorb a viewer clipping
; a doorframe for one frame.
;
; This is a net-driver-wide setting, not a per-actor one: Unreal has no
; per-class relevant timeout. Everything replicated pays it, which for the
; Phase 2-4 actor set is what we want anyway.
RelevantTimeout=0.5

[/Script/Engine.CollisionProfile]
; ── Phase 5: the VisionBlocker channel and profile ──────────────────────────
;
; A dedicated *trace* channel rather than reusing ECC_Visibility, because the
; two questions are genuinely different. ECC_Visibility is "what is under the
; cursor", and the cursor must be able to hit a tree. Line of sight is "what can
; this player be told about", and a tree must not hide an enemy behind it — that
; is Phase 5 decision 6, and it is the reason the tree meshes are SM_ and the
; wall meshes are VB_.
;
; DefaultResponse=ECR_Ignore is the load-bearing half. Unreal applies a new
; channel's default response to every existing profile that does not name the
; channel explicitly, so with Ignore the floors, the props, the loot spheres and
; — importantly — the character capsules are all transparent to vision without
; a single one of them being edited. Only the one profile below opts in.
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=True,Name="VisionBlocker")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel2,DefaultResponse=ECR_Ignore,bTraceType=True,bStaticObject=False,Name="Interact")
+Profiles=(Name="VisionBlocker",CollisionEnabled=QueryAndPhysics,bCanModify=True,ObjectTypeName="WorldStatic",CustomResponses=((Channel="Visibility",Response=ECR_Block),(Channel="Camera",Response=ECR_Block),(Channel="Pawn",Response=ECR_Block),(Channel="VisionBlocker",Response=ECR_Block)),HelpMessage="Solid to movement, the cursor and the camera, and opaque to the Phase 5 line-of-sight trace. Applied to every VB_ mesh by apply_vision_blocker_profile.")

[/Script/Engine.RendererSettings]
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
; Phase 8a: the custom-depth pass, *with stencil*. PP_Outline reads
; CustomStencil to tell a floor tile from everything else, because a 64 cm tile
; seam and the edge of a character are the same size of depth step at this
; camera distance and no threshold separates them. 3 is
; ECustomDepthStencil::EnabledWithStencil; 1 (the default) writes depth only
; and would make every stencil read come back 0, i.e. "nothing is a floor",
; which looks exactly like the material not working.
r.CustomDepth=3

r.GenerateMeshDistanceFields=True

r.DynamicGlobalIlluminationMethod=1

r.ReflectionMethod=1

r.SkinCache.CompileShaders=True

r.RayTracing=True

r.RayTracing.RayTracingProxies.ProjectEnabled=True

r.Substrate=True

r.Substrate.ProjectGBufferFormat=0

r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True

r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8

r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

