; ── Phase 6b: the admin HTTP API's listener ───────────────────────────────
;
; `localhost` is already the engine default (FHttpServerConfig's BindAddress),
; and it is written down here anyway because the admin API has no
; authentication and the loopback bind is half of why that is acceptable — see
; UValhallaAdminServer's class comment. A default is not a guarantee; a line in
; the project's own config is. The port itself is not here: it is
; [/Script/ValhallaCore.ValhallaDataSettings] AdminApiPort in DefaultGame.ini,
; so that the setting a designer changes and the setting the editor's proxy has
; to match are the same one.
[HTTPServer.Listeners]
DefaultBindAddress=localhost

