[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=46964BF4411BC649469AE4972ED4FB07

; Where ValhallaCore reads the game data from (shared/data in this repo).
; Relative paths resolve against the .uproject directory, so the default points
; at ../shared/data beside the Unreal project. Absolute paths are used as-is.
; Edited in the editor under Project Settings > Game > Valhalla Data.
[/Script/ValhallaCore.ValhallaDataSettings]
DataRoot=../shared/data
; Phase 6b: the admin HTTP API the web editor's Live Dashboard talks to.
; 2568 rather than the backend's 2567 so both can run at once. The editor's
; proxy points at it with VALHALLA_ADMIN_URL (editor/src/server.ts).
; Compiled out of a packaged Game target entirely; loopback only.
bEnableAdminApi=True
AdminApiPort=2568
; The admin API's token check: every request needs
; `Authorization: Bearer <server secret>`. On everywhere; the editor's proxy
; sends it. The admin API can set HP, give items and kick, so it is never open.
; See UValhallaAdminServer::Authorize.
bAdminApiRequireSecret=True
;
; The account backend (server/): accounts, characters and persistence.
;
; **No server secret in this file, ever.** Every ini under Config/ is packaged
; into the client, so a secret here would ship to every tester. The game server
; reads it from secrets.local.env at the repo root (gitignored), the
; VALHALLA_SERVER_SECRET environment variable or -ValhallaServerSecret= — see
; UValhallaDataSettings::GetServerSecret and deploy/README.md.
;
; **URLs are quoted, and have to be.** Unreal's ini parser swallows `//`
; comments, so an unquoted http://host:port arrives in C++ as the string "http:"
; and every request then fails in a way that looks exactly like a backend that
; is down. GetResolvedBackendUrl repairs that case and warns, but the quotes are
; what stop it happening.
;
; BackendUrl / GameServerAddress: the editor, PIE and the game server itself,
; all on this machine.
BackendUrl="http://127.0.0.1:2567"
; Where the front end sends a client once a character is chosen. Ignored in
; PIE — see valhalla.FrontEnd.PieServerAddress.
GameServerAddress=127.0.0.1:7777
; What a packaged client (a tester's build) uses instead: the public address.
; The backend is behind Caddy for HTTPS (deploy/Caddyfile); the game server is
; UDP 7777. Override per launch with -ValhallaBackendUrl=<url> and
; -ValhallaGameServer=<host:port>, e.g. when the public IP changes or when you
; test a packaged build on this PC and the router has no NAT loopback.
PublicBackendUrl="https://184.96.133.165"
PublicGameServerAddress=184.96.133.165:7777

[/Script/UnrealEd.ProjectPackagingSettings]
