[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=46964BF4411BC649469AE4972ED4FB07

; Where ValhallaCore reads the game data from (shared/data in this repo).
; Relative paths resolve against the .uproject directory, so the default points
; at ../shared/data beside the Unreal project. Absolute paths are used as-is.
; Edited in the editor under Project Settings > Game > Valhalla Data.
[/Script/ValhallaCore.ValhallaDataSettings]
DataRoot=../shared/data
; Phase 6b: the admin HTTP API the web editor's Live Dashboard talks to.
; 2568 rather than the backend's 2567 so both can run at once. The editor's
; proxy points at it with VALHALLA_ADMIN_URL (editor/src/server.ts).
; Compiled out of a packaged Game target entirely; loopback only.
bEnableAdminApi=True
AdminApiPort=2568
; The admin API's token check: every request needs
; `Authorization: Bearer <ServerSecret>`. On everywhere now that the editor's
; proxy sends it (VALHALLA_SERVER_SECRET, dev default = ServerSecret below) —
; the admin API can set HP, give items and kick, so it is never open.
; See UValhallaAdminServer::Authorize.
bAdminApiRequireSecret=True
;
; Phase 7b: the 1.0 Express server — accounts, characters and persistence. The
; same process the 1.0 client talks to, so a player has one account across both
; projects. ServerSecret authenticates *this process* to the backend's
; server-to-server routes (X-Server-Secret) and is not any player's credential;
; the dev default matches the backend's own and a deployment overrides both in
; an ini this repo does not carry.
; **Quoted, and it has to be.** Unreal's ini parser swallows `//` comments, so
; an unquoted http://host:port arrives in C++ as the string "http:" and every
; request then fails in a way that looks exactly like a backend that is down.
; UValhallaDataSettings::GetResolvedBackendUrl repairs that case and warns, but
; the quotes are what stop it happening.
BackendUrl="http://127.0.0.1:2567"
ServerSecret=dev-server-secret
; Where the front end sends a client once a character is chosen. Ignored in
; PIE — see valhalla.FrontEnd.PieServerAddress.
GameServerAddress=127.0.0.1:7777

[/Script/UnrealEd.ProjectPackagingSettings]
; B-03: a packaged client carries a copy of the game data in Content/Data
; (filled by Plugins/ValhallaTools/.../stage_game_data.py before packaging) and
; starts from it until its first download from the backend's /api/data.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Data")
